<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحدي ركلات الجزاء أونلاين</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07130e;color:white;font-family:Arial;text-align:center}
header{padding:12px;background:#030a07}
h1{color:#36ff91;margin:8px}
button,input{border:0;border-radius:12px;padding:13px;margin:5px;font-size:17px}
button{background:#19c96b;color:#07130e;font-weight:bold}
input{width:85%;max-width:300px;text-align:center}
#gameArea{display:none}
canvas{display:block;width:100%;height:55vh;min-height:320px}
#result{font-size:21px;color:#36ff91;margin:12px}
#score{font-size:18px;margin:10px}
#status{color:#ffda65;margin:12px}
#roomInfo{font-size:19px;color:#36ff91}
</style>
</head>
<body>
<header>
<h1>⚽ تحدي ركلات الجزاء</h1>
<p>العب ضد ربعك أونلاين!</p>
</header>
<div id="lobby">
<h2>ابدأ اللعب</h2>
<button onclick="createRoom()">إنشاء غرفة</button>
<br>
<input id="roomInput" placeholder="اكتب رمز الغرفة">
<br>
<button onclick="joinRoom()">دخول الغرفة</button>
<div id="status">أنشئ غرفة أو ادخل رمز صديقك</div>
</div>
<div id="gameArea">
<div id="roomInfo"></div>
<div id="players"></div>
<canvas id="game"></canvas>
<div id="result">بانتظار اللاعبين</div>
<div id="score"></div>
<div id="controls"></div>
</div>
<script>
const SUPABASE_URL="https://tkzgunmiroijvxxlkhsf.supabase.co";
const SUPABASE_KEY="sb_publishable_Ia_qHzCQ4llHMdcUBJKL_A_2cIWVh3Y";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let myId=localStorage.getItem("penalty_player_id");
if(!myId){
myId=crypto.randomUUID();
localStorage.setItem("penalty_player_id",myId);
}
let room=null;
let roomId=null;
let isHost=false;
let currentState=null;
let poller=null;
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
function resize(){
const dpr=Math.min(devicePixelRatio||1,2);
canvas.width=canvas.clientWidth*dpr;
canvas.height=canvas.clientHeight*dpr;
ctx.setTransform(dpr,0,0,dpr,0,0);
drawField();
}
window.addEventListener("resize",resize);
function drawField(){
let w=canvas.clientWidth,h=canvas.clientHeight;
ctx.clearRect(0,0,w,h);
let sky=ctx.createLinearGradient(0,0,0,h);
sky.addColorStop(0,"#73b9e8");
sky.addColorStop(1,"#c2e6ff");
ctx.fillStyle=sky;
ctx.fillRect(0,0,w,h);
ctx.fillStyle="#444";
ctx.fillRect(0,h*.15,w,h*.22);
ctx.fillStyle="#167b38";
ctx.beginPath();
ctx.moveTo(w*.43,h*.30);
ctx.lineTo(w*.57,h*.30);
ctx.lineTo(w*.98,h);
ctx.lineTo(w*.02,h);
ctx.closePath();
ctx.fill();
ctx.strokeStyle="white";
ctx.lineWidth=3;
ctx.strokeRect(w*.25,h*.22,w*.5,h*.2);
for(let i=1;i<10;i++){
ctx.beginPath();
ctx.moveTo(w*.25+w*.5*i/10,h*.22);
ctx.lineTo(w*.25+w*.5*i/10,h*.42);
ctx.strokeStyle="rgba(255,255,255,.4)";
ctx.lineWidth=1;
ctx.stroke();
}
let kx=w*.5;
ctx.fillStyle="#ffcc00";
ctx.fillRect(kx-w*.025,h*.37,w*.05,h*.09);
ctx.fillStyle="#c68655";
ctx.beginPath();
ctx.arc(kx,h*.35,13,0,Math.PI*2);
ctx.fill();
ctx.fillStyle="#173bff";
ctx.fillRect(w*.44,h*.72,w*.12,h*.14);
ctx.fillStyle="#c68655";
ctx.beginPath();
ctx.arc(w*.5,h*.69,14,0,Math.PI*2);
ctx.fill();
ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(w*.5,h*.92,13,0,Math.PI*2);
ctx.fill();
ctx.strokeStyle="#222";
ctx.stroke();
}
function showStatus(t){
document.getElementById("status").textContent=t;
}
async function createRoom(){
showStatus("جاري إنشاء الغرفة...");
const code=Math.floor(100000+Math.random()*900000).toString();
const state={
shooter:"host",
phase:"shoot",
shooterChoice:null,
keeperChoice:null,
hostGoals:0,
guestGoals:0,
round:1,
message:"الغرفة جاهزة! بانتظار صديقك."
};
const {data,error}=await db.from("rooms").insert({
room_code:code,
host_id:myId,
game_state:state,
status:"waiting"
}).select().single();
if(error){
showStatus("خطأ: "+error.message);
return;
}
room=data;
roomId=data.id;
isHost=true;
startGame();
}
async function joinRoom(){
const code=document.getElementById("roomInput").value.trim();
if(!code){
showStatus("اكتب رمز الغرفة أولاً");
return;
}
showStatus("جاري البحث عن الغرفة...");
const {data,error}=await db.from("rooms")
.select("*").eq("room_code",code).maybeSingle();
if(error||!data){
showStatus("ما حصلنا الغرفة، تأكد من الرمز");
return;
}
if(data.guest_id){
showStatus("الغرفة ممتلئة");
return;
}
if(data.host_id===myId){
showStatus("إنت صاحب الغرفة");
return;
}
const {data:updated,error:updateError}=await db.from("rooms")
.update({guest_id:myId,status:"playing"})
.eq("id",data.id).is("guest_id",null)
.select().maybeSingle();
if(updateError||!updated){
showStatus("ما قدرنا ندخلك، جرّب مرة ثانية");
return;
}
room=updated;
roomId=updated.id;
isHost=false;
startGame();
}
function startGame(){
document.getElementById("lobby").style.display="none";
document.getElementById("gameArea").style.display="block";
resize();
refreshRoom();
if(poller)clearInterval(poller);
poller=setInterval(refreshRoom,1200);
}
async function refreshRoom(){
if(!roomId)return;
const {data,error}=await db.from("rooms")
.select("*").eq("id",roomId).single();
if(error||!data)return;
room=data;
currentState=data.game_state||{};
renderGame();
}
function renderGame(){
if(!currentState)return;
const hostName="اللاعب الأول";
const guestName=room.guest_id?"اللاعب الثاني":"بانتظار اللاعب الثاني";
document.getElementById("roomInfo").textContent=
"رمز الغرفة: "+room.room_code;
document.getElementById("players").textContent=
hostName+" 🆚 "+guestName;
document.getElementById("score").textContent=
"النتيجة: "+currentState.hostGoals+" - "+currentState.guestGoals+
" | الجولة "+currentState.round+" من 5";
document.getElementById("result").textContent=
currentState.message||"";
const controls=document.getElementById("controls");
controls.innerHTML="";
if(!room.guest_id){
controls.textContent="شارك رمز الغرفة مع صديقك وانتظر دخوله.";
return;
}
const shooterId=currentState.shooter==="host"?room.host_id:room.guest_id;
const keeperId=currentState.shooter==="host"?room.guest_id:room.host_id;
const amShooter=myId===shooterId;
const amKeeper=myId===keeperId;
if(currentState.phase==="shoot" && amShooter){
controls.innerHTML="<h3>دورك تسدد! اختر الجهة</h3>";
addChoiceButtons(controls,"shoot");
}
else if(currentState.phase==="save" && amKeeper){
controls.innerHTML="<h3>دورك تحرس! اختر جهة التصدي</h3>";
addChoiceButtons(controls,"save");
}
else if(currentState.phase==="result"){
controls.innerHTML="<h3>انتهت الركلة!</h3>";
if(isHost){
const b=document.createElement("button");
b.textContent="الجولة التالية";
b.onclick=nextRound;
controls.appendChild(b);
}else{
controls.textContent="بانتظار اللاعب الأول يبدأ الجولة التالية";
}
}
else if(currentState.phase==="finished"){
controls.innerHTML="<h2>🏆 انتهت المباراة!</h2>";
const b=document.createElement("button");
b.textContent="مباراة جديدة";
b.onclick=resetMatch;
controls.appendChild(b);
}
else{
controls.textContent=amShooter?
"بانتظار دورك...":"بانتظار اختيار اللاعب الثاني...";
}
}
function addChoiceButtons(container,type){
const choices=[
{v:-1,t:"⬅ يسار"},
{v:0,t:"⬆ الوسط"},
{v:1,t:"يمين ➡"}
];
choices.forEach(c=>{
const b=document.createElement("button");
b.textContent=c.t;
b.onclick=()=>makeChoice(type,c.v);
container.appendChild(b);
});
}
async function saveState(state){
const {error}=await db.from("rooms")
.update({game_state:state,status:"playing",updated_at:new Date().toISOString()})
.eq("id",roomId);
if(error)alert("صار خطأ في الاتصال: "+error.message);
}
async function makeChoice(type,value){
if(!currentState)return;
let s={...currentState};
if(type==="shoot" && s.phase==="shoot"){
s.shooterChoice=value;
s.phase="save";
s.message="⚽ تم التسديد! دور الحارس يختار.";
}
else if(type==="save" && s.phase==="save"){
s.keeperChoice=value;
const saved=s.shooterChoice===s.keeperChoice;
if(!saved){
if(s.shooter==="host")s.hostGoals++;
else s.guestGoals++;
}
s.phase="result";
s.message=saved?"🧤 تصدى الحارس!":"⚽ هــــــــدف!";
}
else return;
currentState=s;
renderGame();
await saveState(s);
}
async function nextRound(){
if(!isHost||currentState.phase!=="result")return;
let s={...currentState};
if(s.round>=5){
s.phase="finished";
s.message="🏆 انتهت المباراة!";
}else{
s.round++;
s.shooter=s.shooter==="host"?"guest":"host";
s.phase="shoot";
s.shooterChoice=null;
s.keeperChoice=null;
s.message="بدأت الجولة الجديدة!";
}
currentState=s;
renderGame();
await saveState(s);
}
async function resetMatch(){
if(!isHost)return;
const s={
shooter:"host",
phase:"shoot",
shooterChoice:null,
keeperChoice:null,
hostGoals:0,
guestGoals:0,
round:1,
message:"بدأت مباراة جديدة!"
};
currentState=s;
renderGame();
await saveState(s);
}
</script>
</body>
</html>
