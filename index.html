<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحدي ركلات الجزاء</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#07130e;
color:white;
font-family:Arial;
text-align:center;
}

header{
padding:12px;
background:#030a07;
}

h1{color:#36ff91;margin:8px}

canvas{
display:block;
width:100%;
height:65vh;
min-height:380px;
}

button{
background:#19c96b;
color:#07130e;
border:0;
border-radius:12px;
padding:14px 20px;
margin:5px;
font-size:17px;
font-weight:bold;
}

#result{
font-size:22px;
color:#36ff91;
margin:12px;
}

#score{font-size:18px}
</style>
</head>

<body>

<header>
<h1>⚽ تحدي ركلات الجزاء</h1>
<p>سجّل أكبر عدد من الأهداف!</p>
</header>

<canvas id="game"></canvas>

<h3>اختر جهة التسديد</h3>

<button onclick="shoot(-1)">⬅ يسار</button>
<button onclick="shoot(0)">⬆ الوسط</button>
<button onclick="shoot(1)">يمين ➡</button>

<div id="result">مستعد للمباراة؟</div>
<div id="score">الأهداف: 0 | الركلات: 0</div>

<button onclick="resetGame()">🔄 مباراة جديدة</button>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
let goals=0;
let shots=0;
let busy=false;
let animation=null;

function resize(){
const dpr=Math.min(devicePixelRatio||1,2);
W=canvas.clientWidth;
H=canvas.clientHeight;
canvas.width=W*dpr;
canvas.height=H*dpr;
ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();

function polygon(points,color){
ctx.fillStyle=color;
ctx.beginPath();
ctx.moveTo(points[0][0],points[0][1]);
points.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));
ctx.closePath();
ctx.fill();
}

function draw(){

ctx.clearRect(0,0,W,H);

// السماء
let sky=ctx.createLinearGradient(0,0,0,H);
sky.addColorStop(0,"#73b9e8");
sky.addColorStop(1,"#c2e6ff");
ctx.fillStyle=sky;
ctx.fillRect(0,0,W,H);

// المدرجات
polygon([[0,H*.15],[W,H*.15],[W,H*.38],[0,H*.38]],"#444");
for(let i=0;i<45;i++){
let x=i*W/45;
ctx.fillStyle=["#fff","#ff3333","#3333ff","#ffcc00"][i%4];
ctx.fillRect(x,H*.19,4,H*.09);
}

// الملعب
polygon([
[W*.43,H*.30],
[W*.57,H*.30],
[W*.98,H],
[W*.02,H]
],"#167b38");

// خطوط الملعب
ctx.strokeStyle="white";
ctx.lineWidth=2;

ctx.beginPath();
ctx.moveTo(W*.43,H*.30);
ctx.lineTo(W*.02,H);
ctx.moveTo(W*.57,H*.30);
ctx.lineTo(W*.98,H);
ctx.stroke();

// خطوط العشب
for(let i=0;i<6;i++){
let y=H*(.4+i*.12);
ctx.globalAlpha=.13;
ctx.fillStyle="#baffb0";
ctx.fillRect(0,y,W,H*.07);
}
ctx.globalAlpha=1;

// المرمى
let gx=W*.25;
let gy=H*.22;
let gw=W*.5;
let gh=H*.20;

ctx.fillStyle="#ffffff";
ctx.fillRect(gx,gy,gw,5);
ctx.fillRect(gx,gy,5,gh);
ctx.fillRect(gx+gw-5,gy,5,gh);

// شبكة المرمى
ctx.strokeStyle="rgba(255,255,255,.55)";
ctx.lineWidth=1;

for(let i=1;i<10;i++){
ctx.beginPath();
ctx.moveTo(gx+gw*i/10,gy);
ctx.lineTo(gx+gw*i/10,gy+gh);
ctx.stroke();
}

for(let i=1;i<5;i++){
ctx.beginPath();
ctx.moveTo(gx,gy+gh*i/5);
ctx.lineTo(gx+gw,gy+gh*i/5);
ctx.stroke();
}

// الحارس
let kx=W*.5;
let ky=H*.37;

if(animation){
kx+=animation.keeperX*W*.15*animation.progress;
}

ctx.fillStyle="#ffcc00";
ctx.fillRect(kx-W*.025,ky,W*.05,H*.09);

ctx.fillStyle="#c68655";
ctx.beginPath();
ctx.arc(kx,ky-10,W*.025,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#222";
ctx.fillRect(kx-W*.04,ky+H*.09,W*.025,H*.09);
ctx.fillRect(kx+W*.015,ky+H*.09,W*.025,H*.09);

// اللاعب من الخلف
ctx.fillStyle="#173bff";
ctx.fillRect(W*.44,H*.72,W*.12,H*.14);

ctx.fillStyle="#c68655";
ctx.beginPath();
ctx.arc(W*.5,H*.69,W*.035,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#111";
ctx.fillRect(W*.445,H*.85,W*.04,H*.12);
ctx.fillRect(W*.515,H*.85,W*.04,H*.12);

// الكرة
let bx=W*.5;
let by=H*.92;
let size=W*.035;

if(animation){
let t=animation.progress;
bx=W*.5+(animation.targetX-W*.5)*t;
by=H*.92-(H*.55)*t;
size=W*.035*(1-.5*t);
}

ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(bx,by,size,0,Math.PI*2);
ctx.fill();

ctx.strokeStyle="#222";
ctx.lineWidth=2;
ctx.stroke();

ctx.fillStyle="#222";
ctx.beginPath();
ctx.arc(bx,by,size*.35,0,Math.PI*2);
ctx.fill();

if(animation && animation.progress>=1){
finishShot();
}

requestAnimationFrame(draw);
}

function shoot(direction){

if(busy || shots>=5)return;

busy=true;
shots++;

let keeperDirection=Math.floor(Math.random()*3)-1;

animation={
progress:0,
targetX:W*.5+direction*W*.20,
keeperX:keeperDirection,
start:performance.now()
};

document.getElementById("result").textContent="⚽ تسديدة قوية!";

function move(){
if(!animation)return;

animation.progress=Math.min(
(performance.now()-animation.start)/850,1
);

if(animation.progress<1){
requestAnimationFrame(move);
}
}

requestAnimationFrame(move);
}

function finishShot(){

if(!animation)return;

let saved=Math.abs(
(animation.targetX-W*.5)/W*.20-animation.keeperX
)<.5;

if(saved){
document.getElementById("result").textContent="🧤 تصدى الحارس!";
}else{
goals++;
document.getElementById("result").textContent="⚽ هــــــــدف!";
}

document.getElementById("score").textContent=
`الأهداف: ${goals} | الركلات: ${shots}`;

if(shots===5){
document.getElementById("result").textContent=
`🏆 انتهت المباراة! نتيجتك ${goals} من 5`;
}

animation=null;

setTimeout(()=>{
busy=false;
},500);

}

function resetGame(){

goals=0;
shots=0;
busy=false;
animation=null;

document.getElementById("result").textContent="مستعد للمباراة؟";
document.getElementById("score").textContent="الأهداف: 0 | الركلات: 0";
}

requestAnimationFrame(draw);

</script>

</body>
</html>
